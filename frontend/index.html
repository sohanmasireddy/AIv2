
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABC123</title>
<script>
  if (!("userAgentData" in navigator)) document.documentElement.classList.add("unsupported");
</script>
<link rel="stylesheet" href="./glass/liquid-glass.css">
<style>
  :root { --text: #f4f7ff; --muted: rgba(244,247,255,.68); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)), url("city.png") center / cover no-repeat fixed;
  }

  #unsupported { display: none; }
  html.unsupported, html.unsupported body { background: #fff; }
  html.unsupported body > *:not(#unsupported) { display: none !important; }
  html.unsupported #unsupported {
    display: flex; position: fixed; inset: 0; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: #fff; color: #111;
    font-size: clamp(22px, 4vw, 34px); font-weight: 650;
  }

  #scroller { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -ms-overflow-style: none; }
  #scroller::-webkit-scrollbar { display: none; }
  #log {
    position: relative;
    max-width: 820px; margin: 0 auto;
    min-height: 100dvh;
    display: flex; flex-direction: column; gap: 14px;
    padding: max(20px, env(safe-area-inset-top)) 14px calc(var(--comp-h, 90px) + 44px);
  }
  .empty { margin: auto; text-align: center; color: var(--muted); text-shadow: 0 1px 14px rgba(0,0,0,.55); }
  .empty b { display: block; font-size: 36px; color: var(--text); letter-spacing: .06em; margin-bottom: 6px; }

  .msg {
    max-width: 85%; padding: 12px 18px; line-height: 1.5; border-radius: 26px;
    white-space: pre-wrap; overflow-wrap: anywhere; text-shadow: 0 1px 8px rgba(0,0,0,.4);
  }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; }
  .msg img { display: block; max-width: 220px; max-height: 220px; border-radius: 14px; margin-bottom: 8px; }
  .msg.err { color: #ffd0d0; }
  .thinking-status { color: var(--muted); }

  #composer {
    position: fixed; z-index: 10;
    left: 14px; right: 14px; max-width: 792px; margin: 0 auto;
    bottom: max(14px, env(safe-area-inset-bottom));
    padding: 8px 10px; border-radius: 26px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #preview { display: none; gap: 8px; padding: 4px 8px 0; align-items: center; font-size: 12px; color: var(--muted); }
  #preview img { height: 52px; border-radius: 10px; }
  .row { display: flex; align-items: flex-end; gap: 2px; }
  textarea {
    flex: 1; resize: none; height: 44px; max-height: 160px; padding: 11px 8px; border: 0; outline: 0;
    background: transparent; color: var(--text); font: inherit; line-height: 22px; text-shadow: 0 1px 8px rgba(0,0,0,.4);
    overflow-y: hidden; scrollbar-width: none; -ms-overflow-style: none;
  }
  textarea::-webkit-scrollbar { display: none; width: 0; height: 0; }
  textarea::placeholder { color: var(--muted); }
  .icon {
    width: 42px; height: 44px; flex: none; padding: 0; display: grid; place-items: center;
    background: none; border: 0; color: var(--text); cursor: pointer; opacity: .9;
    -webkit-tap-highlight-color: transparent; transition: opacity .15s, transform .15s;
  }
  .icon:hover { opacity: 1; }
  .icon:active { transform: scale(.9); }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #preview .icon { width: 28px; height: 28px; }
  #preview .icon svg { width: 16px; height: 16px; }

  .lg-host, .lg-host + .lg-cover {
    --lg-glint-exp: 1; --lg-glint-sat: 1;
    --lg-rim-exp: 1; --lg-rim-sat: 1;
    --lg-fold-exp: 1; --lg-fold-sat: 1;
    --lg-rim-w: 0px; --lg-rim-fade: 0px;
    --lg-spec: 0; --lg-underlay: 0;
    --lg-shadow-o: 0; --lg-caustic-o: 0;
  }
</style>
</head>
<body>
<div id="unsupported">Switch to a Chromium based browser!</div>

<div id="scroller">
  <div id="log">
    <div class="empty"><b>ABC123</b>Ask anything. Attach an image.</div>
  </div>
</div>

<div id="composer">
  <div id="preview">
    <img id="prevImg" alt="">
    <span id="prevInfo"></span>
    <button class="icon" id="prevX" title="Remove image" aria-label="Remove image">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="row">
    <button class="icon" id="attach" title="Attach image" aria-label="Attach image">
      <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Message ABC123"></textarea>
    <button class="icon" id="send" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script type="module">
import { createLiquidGlass } from "./glass/liquid-glass.js";

if (document.documentElement.classList.contains("unsupported")) {
  throw new Error("ABC123 needs a Chromium based browser.");
}

const $ = (id) => document.getElementById(id);
const log = $("log"), scroller = $("scroller"), input = $("input"), composer = $("composer");

/* Hide only Streamlit's injected hosting/profile badge in the parent page. */
function hideStreamlitBranding() {
  try {
    const parentDoc = window.parent.document;
    const selectors = [
      'a[href*="streamlit.io"]',
      'a[href*="streamlit.app"]',
      '[class*="viewerBadge"]',
      '[class*="profileContainer"]',
      '[class*="profilePreview"]',
      '[data-testid*="viewerBadge"]'
    ].join(",");

    parentDoc.querySelectorAll(selectors).forEach((el) => {
      const label = [
        el.textContent || "",
        el.getAttribute("aria-label") || "",
        el.getAttribute("title") || ""
      ].join(" ").toLowerCase();
      const href = (el.getAttribute("href") || "").toLowerCase();
      if (
        href.includes("streamlit.io") ||
        href.includes("streamlit.app") ||
        label.includes("sohanmsireddy") ||
        label.includes("hosted with streamlit")
      ) {
        el.style.setProperty("display", "none", "important");
      }
    });
  } catch {
    /* Parent-page access may be restricted by the hosting environment. */
  }
}

hideStreamlitBranding();
try {
  const badgeObserver = new MutationObserver(hideStreamlitBranding);
  badgeObserver.observe(window.parent.document.documentElement, {
    childList: true,
    subtree: true
  });
} catch {
  /* Keep the app working even if the host blocks parent-page observation. */
}

/* Streamlit component bridge. */
let pending = null;
const stSend = (type, data = {}) => parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:" + type,
  ...data
}, "*");

addEventListener("message", (event) => {
  if (event.source !== parent || !event.data || event.data.type !== "streamlit:render") return;
  const reply = event.data.args && event.data.args.reply;
  if (reply && pending && reply.id === pending.id) {
    const current = pending;
    pending = null;
    current.done(reply);
  }
});

stSend("componentReady", { apiVersion: 1 });
stSend("setFrameHeight", { height: 600 });

function askPython(messages) {
  return new Promise((resolve, reject) => {
    const id = Date.now() + "-" + Math.random().toString(36).slice(2);
    const timer = setTimeout(() => {
      pending = null;
      reject(new Error("Timed out waiting for Cloudflare."));
    }, 330000);
    pending = {
      id,
      done: (reply) => {
        clearTimeout(timer);
        resolve(reply);
      }
    };
    stSend("setComponentValue", {
      value: { id, messages },
      dataType: "json"
    });
  });
}

/* Liquid glass. */
const hosts = () => [composer, ...log.querySelectorAll(".msg")];
const GLASS = {
  radius: 24,
  rim: 3,
  blur: 3,
  saturate: 1,
  reflect: true,
  reflectStrength: 2
};

function makeGlass(element) {
  element.setAttribute("data-lg-dark", "");
  try {
    element._g = createLiquidGlass(element, GLASS);
  } catch (error) {
    console.warn("Liquid glass failed:", error);
    element._g = null;
  }
}

makeGlass(composer);

const io = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    const element = entry.target;
    if (entry.isIntersecting) {
      if (!element._g) makeGlass(element);
    } else if (element._g) {
      element._g.destroy();
      element._g = null;
    }
  }
}, { root: scroller, rootMargin: "700px 0px" });

new ResizeObserver(() => {
  document.documentElement.style.setProperty("--comp-h", composer.offsetHeight + "px");
}).observe(composer);

/* Image compression for Cloudflare Gemma 4 vision input. */
async function compressImage(file, maxSide = 1024, quality = 0.72) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const width = Math.round(bitmap.width * scale);
  const height = Math.round(bitmap.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext("2d");
  if (!context) throw new Error("Could not process the selected image.");
  context.fillStyle = "#fff";
  context.fillRect(0, 0, width, height);
  context.drawImage(bitmap, 0, 0, width, height);
  const dataUrl = canvas.toDataURL("image/jpeg", quality);
  return {
    dataUrl,
    base64: dataUrl.split(",")[1],
    bytes: Math.round(dataUrl.length * 0.75)
  };
}

const kb = (size) => (size / 1024).toFixed(0) + " KB";

/* Chat. */
const toBottom = () => scroller.scrollTo(0, scroller.scrollHeight);
const nearBottom = () => (
  scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 160
);

let history = [];
let pendingImage = null;
let busy = false;

$("attach").onclick = () => $("file").click();

$("file").onchange = async (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    const output = await compressImage(file);
    pendingImage = output;
    $("prevImg").src = output.dataUrl;
    $("prevInfo").textContent = `${kb(file.size)} → ${kb(output.bytes)}`;
    $("preview").style.display = "flex";
  } catch (error) {
    alert("Couldn't read that image: " + error.message);
  }
};

$("prevX").onclick = () => {
  pendingImage = null;
  $("preview").style.display = "none";
};

function autosize() {
  input.style.height = "44px";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
  input.style.overflowY = input.scrollHeight > 160 ? "auto" : "hidden";
}

input.addEventListener("input", autosize);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});
$("send").onclick = send;

function addMsg(role, text, imageDataUrl) {
  log.querySelector(".empty")?.remove();
  const element = document.createElement("div");
  element.className = `msg ${role}`;
  if (imageDataUrl) {
    const image = document.createElement("img");
    image.src = imageDataUrl;
    image.alt = "Uploaded image";
    element.appendChild(image);
  }
  const span = document.createElement("span");
  span.textContent = text;
  element.appendChild(span);
  log.appendChild(element);
  io.observe(element);
  return span;
}

/* Reveal completed responses progressively. */
function reveal(element, text) {
  return new Promise((resolve) => {
    if (!text) {
      element.textContent = "(empty reply)";
      resolve();
      return;
    }
    let index = 0;
    const step = Math.max(3, Math.ceil(text.length / 80));
    const timer = setInterval(() => {
      const stickToBottom = nearBottom();
      index = Math.min(text.length, index + step);
      element.textContent = text.slice(0, index);
      if (stickToBottom) toBottom();
      if (index >= text.length) {
        clearInterval(timer);
        resolve();
      }
    }, 20);
  });
}

async function send() {
  const text = input.value.trim();
  if ((!text && !pendingImage) || busy) return;

  busy = true;
  const message = {
    role: "user",
    content: text || "Describe this image."
  };
  if (pendingImage) message.images = [pendingImage.base64];

  addMsg("user", message.content, pendingImage?.dataUrl);
  history.push(message);

  input.value = "";
  autosize();
  pendingImage = null;
  $("preview").style.display = "none";

  const output = addMsg("bot", "Thinking…");
  output.classList.add("thinking-status");
  toBottom();

  try {
    const result = await askPython(history);
    if (result.error) throw new Error(result.error);
    const answer = result.text || "";
    output.classList.remove("thinking-status");
    await reveal(output, answer);
    history.push({ role: "assistant", content: answer });
  } catch (error) {
    output.parentElement.classList.add("err");
    output.classList.remove("thinking-status");
    output.textContent = "Error: " + error.message;
    history.pop();
  } finally {
    busy = false;
    toBottom();
  }
}
</script>
</body>
</html>
